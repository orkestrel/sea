name: ci.yml

on:
  push:
  pull_request:

# A publish.yml with `permissions: id-token: write` and
# `npm publish --provenance` (npm provenance / OIDC trusted publishing) is a
# documented follow-up — not yet implemented (see SECURITY.md hardening roadmap).

jobs:
  gates:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, macos-14]
        node: ['24', '26']
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint:check

      - name: Typecheck
        run: npm run check

      - name: Typecheck src
        run: npm run check:src

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

  sea:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, macos-14]
        node: ['24', '26']
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Write smoke scratch fixtures
        shell: bash
        run: |
          mkdir -p sea-smoke
          cat > sea-smoke/entry.cjs <<'EOF'
          console.log('sea-ok')
          EOF
          cat > sea-smoke/run.mjs <<'EOF'
          import { createSEA } from '../dist/src/server/index.js'

          const seal = createSEA({
            name: 'smoke',
            entry: { path: 'entry.cjs' },
            output: 'out',
            root: process.cwd(),
          })

          await seal.execute()
          EOF

      - name: Build SEA smoke binary
        working-directory: sea-smoke
        run: node run.mjs

      - name: Run SEA smoke binary (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          out="sea-smoke/out/smoke"
          stdout="$("$out")"
          echo "$stdout"
          if [[ "$stdout" != *"sea-ok"* ]]; then
            echo "expected stdout to contain 'sea-ok', got: $stdout"
            exit 1
          fi

      - name: Run SEA smoke binary (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          out="sea-smoke/out/smoke.exe"
          stdout="$("$out")"
          echo "$stdout"
          if [[ "$stdout" != *"sea-ok"* ]]; then
            echo "expected stdout to contain 'sea-ok', got: $stdout"
            exit 1
          fi
